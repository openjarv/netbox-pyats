name: CI

# CI for netbox-pyats. Three lanes, mirroring the dual-mode test setup in
# conftest.py and the compatibility matrix in README.md (NetBox 4.6.x ×
# Python 3.10/3.11/3.12 × pyATS 26.x worker-only):
#
#   lint        - black / isort / flake8 (single Python; fast).
#   unit        - pure-Python tests on plain Python (matrix 3.10/3.11/3.12)
#                 with pyats[full] installed so test_testbed.py runs instead
#                 of skipping. No NetBox / PostgreSQL / Redis required.
#   integration - full suite inside a dedicated `netbox-test` container
#                 (docker-compose.test.yml, ATW-357) that runs pytest without
#                 granian, with the default backend versions (NetBox 4.6.5 ×
#                 PostgreSQL 18 × Valkey 9.1). CI uses --create-db for a
#                 clean, authoritative pre-merge regression pass; local dev
#                 uses --reuse-db for velocity. Gating since ATW-38 resolved
#                 the NetBox 4.6.5 compatibility bugs (PR #15) and the dev
#                 image now builds pyats[full] and applies the plugin
#                 migrations.
#
# The integration lane runs a single cell rather than a PostgreSQL × Redis
# matrix: the plugin has no direct PostgreSQL or Redis surface (Django ORM +
# JSONField only; RQ queue declared by name, enqueued via netbox.core.Job),
# so sweeping backend versions tests NetBox's infrastructure, not the plugin.
# ATW-96 audit + board decision (2026-07-22). The apt-retry robustness in the
# pyats-worker Dockerfile (ATW-101, PR #35) keeps the single cold-build lane
# resilient to transient mirror outages.
#
# References:
#   - Architecture decision D-7 (ATW-23 architecture document, §4/§5).
#   - ATW-38: NetBox 4.6.5 compatibility fixes (PR #15).
#   - ATW-96: compatibility-matrix CI (collapsed to single cell per audit).
#   - ATW-101: apt-retry + backoff in the pyats-worker Dockerfile (PR #35).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (black / isort / flake8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: black --check
        run: black --check netbox_pyats

      - name: isort --check-only
        run: isort --check-only netbox_pyats

      - name: flake8
        run: flake8 netbox_pyats

  graphify-scrub-guard:
    # Build-time guard against absolute home-path leakage in committed
    # graphify-out/ artifacts (the PR #41 regression, ATW-112 gate). Runs the
    # scripts/graphify-scrub-guard.sh check on every PR/push so a leaked
    # GRAPH_REPORT.md or graph.html <title> fails CI before merge.
    # The nightly refresh routine also runs this guard locally before commit;
    # this lane is the structural backstop. Refs: ATW-125, ATW-112, ATW-121.
    name: Graphify scrub guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run scrub guard (check mode)
        run: bash scripts/graphify-scrub-guard.sh

  pr-body-scrub-guard:
    # CI guard against Paperclip control-plane metadata (agent UUIDs,
    # `agent://` URIs, internal org-role titles) leaking into public GitHub
    # PR bodies — the repeat finding across PRs #44–#47 (ATW-159). Scans the
    # PR *description* (not the diff); the diff is Security's gate (ATW-112
    # / gitleaks). Fails the lane if any forbidden pattern is present so a
    # leak is caught before merge, not after a Security escalation.
    # Refs: ATW-159, ATW-112, ATW-55. Sibling: graphify-scrub-guard lane.
    name: PR body scrub guard
    runs-on: ubuntu-latest
    # Only PR events carry a body to scan; push events pass through (the
    # guard itself no-ops on non-pull_request events).
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Run PR body scrub guard
        run: bash scripts/pr-body-scrub-guard.sh

  gitleaks-fixture-regression:
    # ATW-167 companion CI assertion for the secret-detection fixture path
    # allowlist. .gitleaks.toml path-allowlists test_secret_detection.py so
    # gitleaks does not block commits containing the deliberately-real-shaped
    # positive test values. A path allowlist is content-blind — it cannot
    # detect a real secret placed inside that file (the ATW-163 root-cause
    # hole). This lane runs scripts/gitleaks-fixture-regression.sh, which
    # copies the fixture outside the allowlist, injects a real-shaped value,
    # and asserts gitleaks catches it. If the path allowlist ever silently
    # regressed into a real-secret blind spot, this lane fails. Refs:
    # ATW-167, ATW-163, ATW-159, ATW-112.
    name: Gitleaks fixture regression (ATW-167)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run fixture regression guard
        run: bash scripts/gitleaks-fixture-regression.sh

  unit:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install plugin (dev) + pyats[full]
        # pyats[full] is installed so test_testbed.py runs instead of skipping
        # via pytest.importorskip("pyats"). NetBox is intentionally NOT
        # installed here: the model/view/api suites skip themselves via
        # pytest.importorskip("netbox") and are exercised by the integration
        # job below.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,pyats]"

      - name: Run pure-Python tests
        run: |
          pytest netbox_pyats/tests/test_crypto.py \
                 netbox_pyats/tests/test_testbed.py \
                 netbox_pyats/tests/test_diff.py \
                 netbox_pyats/tests/test_capture.py \
                 netbox_pyats/tests/test_compliance.py \
                 netbox_pyats/tests/test_supported_platforms.py \
                 netbox_pyats/tests/test_graphify_scrub_guard.py \
                 netbox_pyats/tests/test_pr_body_scrub_guard.py \
                 netbox_pyats/tests/test_secret_detection.py \
                 netbox_pyats/tests/test_template_extension.py \
                 -v

  integration:
    name: Integration (NetBox 4.6.5 / PG 18 / Valkey 9.1)
    runs-on: ubuntu-latest
    # Full NetBox-dependent suite inside a dedicated `netbox-test` container
    # (ATW-357) with the default backend versions (NetBox 4.6.5 × PostgreSQL 18
    # × Valkey 9.1). Gating (`continue-on-error: false`); ATW-38/PR #15 fixed
    # the NetBox 4.6.5 compatibility bugs, and the dev image builds pyats[full]
    # + applies the plugin migrations.
    #
    # The integration lane uses the same `netbox-test` compose service that
    # local dev uses (docker-compose.test.yml), so local + CI run the exact
    # same container shape. The `netbox-test` service runs pytest WITHOUT
    # granian, which removes the granian-connection race (ATW-85 / ATW-188)
    # that previously made re-runs unreliable. CI is one-shot
    # (`up --wait → run netbox-test → down -v`), so --reuse-db has no payoff
    # here — CI uses --create-db for a clean, authoritative pre-merge
    # regression pass (migration-order + data-leakage coverage). Local dev uses
    # --reuse-db for velocity; CI clean for correctness. (ATW-351 ADR-1.)
    #
    # The plugin has no direct PostgreSQL or Redis surface, so a backend
    # version sweep tests NetBox infra rather than the plugin — collapsed to
    # a single cell per the ATW-96 audit + board decision (2026-07-22).
    continue-on-error: false
    # Cold start (migrations + reindex) inside the test container takes ~6-9
    # min on a GitHub Actions runner, and the test suite itself runs ~9 min.
    # 45 min gives headroom for the buildx build, cold start, and full suite.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Bring up postgres + redis
        # The netbox-test service depends_on postgres + redis (service_healthy).
        # Bring them up with --wait so the test container does not race a
        # still-starting postgres. The web `netbox` service is NOT started —
        # the test lane does not need it, mirroring the local `dev-worktree.sh
        # test` path. NETBOX_TEST_MEM=2g gives the migration + pytest test
        # runner enough headroom; the default 1g cap is tight for the full
        # suite on a constrained runner. (ATW-357.)
        env:
          NETBOX_TEST_MEM: 2g
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml up -d --wait postgres redis
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml ps

      - name: Run NetBox-dependent suite (netbox-test, --create-db)
        # Run the one-shot netbox-test container with --create-db for a clean
        # pre-merge regression pass. The entrypoint cd's to the bind-mounted
        # plugin source before running pytest (it does NOT run NetBox's
        # docker-entrypoint.sh, which requires a different cwd). Extra args
        # after the service's default command override it.
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml run --rm -T netbox-test --create-db netbox_pyats/tests -v

      - name: Dump NetBox logs on failure
        if: failure()
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml logs netbox-test || true
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml logs postgres || true

      - name: Tear down dev stack
        if: always()
        run: |
          docker compose -f docker-compose.dev.yml -f docker-compose.test.yml down -v || true